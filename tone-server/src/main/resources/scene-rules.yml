# 语气检查场景规则库：check_scene_rules 工具的数据源
# key 与小程序端场景选择的 value 对应
workplace:
  label: 职场
  rules:
    - 对上级/同事避免命令式口吻，用询问代替指派
    - 催促进度时先给缓冲（"方便的时候"），并说明原因
    - 不评价对方人格，只陈述事实与影响
    - 涉及责任划分时用"我们一起"代替"这是你的问题"
    - 避免过度使用感叹号和表情

social:
  label: 社交
  rules:
    - 拒绝邀约先表达感谢与歉意，再给出理由
    - 理由真实简短即可，不必过度解释
    - 主动给出替代方案（下次一定 / 我请你吃饭）
    - 避免已读不回式的敷衍表达

relationship:
  label: 亲密关系
  rules:
    - 描述自己的感受（我有点难过），而非指责对方（你总是）
    - 道歉要具体：说清错在哪、怎么弥补，而不是只说"对不起"
    - 避免冷战式表达（随便你、不想说了）
    - 保留情绪温度，但给对方台阶下

moments:
  label: 朋友圈
  rules:
    - 控制长度，前三行要有信息量或钩子
    - 避免"标题党"式夸张表达
    - 自嘲优于炫耀，观点表达留余地
    - 慎用网络烂梗，保持个人风格

service:
  label: 客服
  rules:
    - 先共情再解决："理解您的感受" + 具体行动
    - 明确告知处理步骤与时间节点
    - 不承诺做不到的事，超权限需求要如实说明并上报
    - 避免机械复制话术，回应用户的具体问题
